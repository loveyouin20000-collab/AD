  config:
    method:
      name: residual_gain_equal_fusion
      fusion: equal
      policy: gain_ucb
  estimated_gpu_hours: 0.4
  output_dir: artifacts/experiments/residual_gain_equal_fusion
  tags: []
- id: full_conservative
  group: method
  description: Full method conservative profile
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/evaluate_adaptive.py --config configs/rad/adaptive.yaml --profile
