schema_version: 1
description: Immutable paper experiment matrix for Residual-Aware Adaptive-Depth VisualAD.
hardware_note: Primary wall-clock estimates assume independent rows parallelized across available GPUs
  (e.g. 2x RTX 4090D).
defaults:
  seed: 111
  image_size: 518
  backbone:
    depth: 24
    candidate_layers:
    - 6
    - 12
    - 18
    - 24
  data:
    dataset: mvtec
    data_path: data/mvtec
    split_manifest: artifacts/splits/mvtec_seed111.jsonl
  teacher:
    checkpoint_path: weight/train_on_mvtec/CLIP.pth
    backbone: ViT-L/14@336px
  zero_shot:
    source_dataset: mvtec
    target_datasets:
    - visa
    target_tuning: false
  checkpoints:
    dlcm: artifacts/checkpoints/fusion/seed_222/dlcm.pt
    lse: artifacts/checkpoints/lse/lse_best.pt
    policy_profiles: artifacts/calibration/policy/policy_profiles.json
matrix:
- id: original_visualad
  group: method
  description: Official VisualAD full-depth equal path
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/reproduce_baseline.py --config configs/rad/baseline_mvtec_to_visa.yaml --seed
    {seed} --output-dir {output_dir} --train-data-path data/mvtec --test-data-path data/Visa
  config:
    method:
      name: original_visualad
      exit: none
      fusion: equal
      force_full_depth: true
  estimated_gpu_hours: 0.4
  output_dir: artifacts/experiments/original_visualad
  tags: []
- id: fixed_exit_12_equal
  group: method
  description: Fixed early exit at layer 12 with equal fusion
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/evaluate_adaptive_dataset.py --config configs/rad/adaptive.yaml --overlay configs/rad/matrix/fixed_exit_12_equal.yaml
    --seed {seed} --device {device} --output-dir {output_dir}
  config:
    method:
      name: fixed_exit
      exit_depth: 12
      fusion: equal
  estimated_gpu_hours: 0.25
  output_dir: artifacts/experiments/fixed_exit_12_equal
  tags: []
- id: fixed_exit_18_equal
  group: method
  description: Fixed early exit at layer 18 with equal fusion
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/evaluate_adaptive_dataset.py --config configs/rad/adaptive.yaml --overlay configs/rad/matrix/fixed_exit_18_equal.yaml
    --seed {seed} --device {device} --output-dir {output_dir}
  config:
    method:
      name: fixed_exit
      exit_depth: 18
      fusion: equal
  estimated_gpu_hours: 0.3
  output_dir: artifacts/experiments/fixed_exit_18_equal
  tags: []
- id: fixed_exit_12_dynamic
  group: method
  description: Fixed early exit at layer 12 with dynamic fusion
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/evaluate_adaptive_dataset.py --config configs/rad/adaptive.yaml --overlay configs/rad/matrix/fixed_exit_12_dynamic.yaml
    --seed {seed} --device {device} --output-dir {output_dir}
  config:
    method:
      name: fixed_exit
      exit_depth: 12
      fusion: dynamic
  estimated_gpu_hours: 0.25
  output_dir: artifacts/experiments/fixed_exit_12_dynamic
  tags: []
- id: fixed_exit_18_dynamic
  group: method
