  command: python tools/evaluate_adaptive_dataset.py --config configs/rad/adaptive.yaml --overlay configs/rad/matrix/fixed_exit_18_dynamic.yaml
    --seed {seed} --device {device} --output-dir {output_dir}
  config:
    method:
      name: fixed_exit
      exit_depth: 18
      fusion: dynamic
  estimated_gpu_hours: 0.3
  output_dir: artifacts/experiments/fixed_exit_18_dynamic
  tags: []
- id: static_learned_fusion
  group: method
