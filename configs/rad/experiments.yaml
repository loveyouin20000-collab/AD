schema_version: 1
description: Immutable paper experiment matrix for Residual-Aware Adaptive-Depth VisualAD.
hardware_note: Primary wall-clock estimates assume independent rows parallelized across
  available GPUs (e.g. 2x RTX 4090D).
defaults:
  seed: 111
  image_size: 518
  backbone:
    depth: 24
    candidate_layers:
    - 6
    - 12
    - 18
    - 24
  data:
    dataset: mvtec
    data_path: /root/autodl-tmp/data/mvtec
    split_manifest: artifacts/splits/mvtec_seed111.jsonl
  teacher:
    checkpoint_path: weight/train_on_mvtec/CLIP.pth
    backbone: ViT-L/14@336px
  zero_shot:
    source_dataset: mvtec
    target_datasets:
    - visa
    target_tuning: false
  checkpoints:
    dlcm: artifacts/checkpoints/fusion/seed_222/dlcm.pt
    lse: artifacts/checkpoints/lse/lse_best.pt
    policy_profiles: artifacts/calibration/policy/policy_profiles.json
matrix:
- id: original_visualad
  group: method
  description: Official VisualAD full-depth equal path
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/reproduce_baseline.py --config configs/rad/baseline_mvtec_to_visa.yaml
    --seed {seed} --device {device} --output-dir {output_dir}
  config:
    method:
      name: original_visualad
      exit: none
      fusion: equal
      force_full_depth: true
  estimated_gpu_hours: 0.4
  output_dir: artifacts/experiments/original_visualad
  tags: []
- id: fixed_exit_12
  group: method
  description: Fixed early exit at layer 12
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/benchmark_latency.py --config configs/rad/benchmark.yaml --methods
    fixed_12 --warmup 5 --repetitions 20 --seed {seed} --device {device} --output-dir
    {output_dir}
  config:
    method:
      name: fixed_exit
      exit_depth: 12
      fusion: dynamic
  estimated_gpu_hours: 0.25
  output_dir: artifacts/experiments/fixed_exit_12
  tags: []
- id: fixed_exit_18
  group: method
  description: Fixed early exit at layer 18
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/benchmark_latency.py --config configs/rad/benchmark.yaml --methods
    fixed_18 --warmup 5 --repetitions 20 --seed {seed} --device {device} --output-dir
    {output_dir}
  config:
    method:
      name: fixed_exit
      exit_depth: 18
      fusion: dynamic
  estimated_gpu_hours: 0.3
  output_dir: artifacts/experiments/fixed_exit_18
  tags: []
- id: static_learned_fusion
  group: method
  description: Static learned fusion at full depth
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/evaluate_adaptive.py --config configs/rad/adaptive.yaml --seed
    {seed} --device {device} --output-dir {output_dir} --profile balanced --force-full-depth
  config:
    method:
      name: static_learned_fusion
      fusion: static_learned
      force_full_depth: true
  estimated_gpu_hours: 0.35
  output_dir: artifacts/experiments/static_learned_fusion
  tags: []
- id: dynamic_fusion_only
  group: method
  description: Dynamic fusion full depth without early exit
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/evaluate_adaptive.py --config configs/rad/adaptive.yaml --force-full-depth
    --seed {seed} --device {device} --output-dir {output_dir}
  config:
    method:
      name: dynamic_fusion_only
      fusion: dynamic
      force_full_depth: true
  estimated_gpu_hours: 0.35
  output_dir: artifacts/experiments/dynamic_fusion_only
  tags: []
- id: confidence_only_exit
  group: method
  description: Exit using image confidence only
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/evaluate_adaptive.py --config configs/rad/adaptive.yaml --seed
    {seed} --device {device} --output-dir {output_dir} --profile balanced
  config:
    method:
      name: confidence_only_exit
      policy: confidence_only
    policy_override:
      require_map_uncertainty: false
      require_image_confidence: true
      require_stability: false
      use_gain_ucb: false
  estimated_gpu_hours: 0.35
  output_dir: artifacts/experiments/confidence_only_exit
  tags: []
- id: stability_only_exit
  group: method
  description: Exit using map stability only
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/evaluate_adaptive.py --config configs/rad/adaptive.yaml --seed
    {seed} --device {device} --output-dir {output_dir} --profile balanced
  config:
    method:
      name: stability_only_exit
      policy: stability_only
    policy_override:
      require_map_uncertainty: false
      require_image_confidence: false
      require_stability: true
      use_gain_ucb: false
  estimated_gpu_hours: 0.35
  output_dir: artifacts/experiments/stability_only_exit
  tags: []
- id: confidence_stability_exit
  group: method
  description: Exit using confidence + stability
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/evaluate_adaptive.py --config configs/rad/adaptive.yaml --seed
    {seed} --device {device} --output-dir {output_dir} --profile balanced
  config:
    method:
      name: confidence_stability_exit
      policy: confidence_stability
    policy_override:
      require_map_uncertainty: false
      require_image_confidence: true
      require_stability: true
      use_gain_ucb: false
  estimated_gpu_hours: 0.35
  output_dir: artifacts/experiments/confidence_stability_exit
  tags: []
- id: residual_gain_equal_fusion
  group: method
  description: Residual-gain exit with equal fusion
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/evaluate_adaptive.py --config configs/rad/adaptive.yaml --seed
