  - shapley
- id: ablation_shapley_exact
  group: ablation
  description: Exact checkpoint-specific Shapley targets
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/generate_shapley_targets.py --config configs/rad/fusion.yaml
