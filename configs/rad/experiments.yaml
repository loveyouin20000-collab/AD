  config:
    method:
      name: ablation
      shapley_mode: exact
    targets:
      shapley_mode: exact
  estimated_gpu_hours: 0.8
  output_dir: artifacts/experiments/ablation_shapley_exact
  tags:
  - shapley
- id: ablation_shapley_loo
  group: ablation
