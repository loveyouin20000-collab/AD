  config:
    method:
      name: full_method
      profile: conservative
      fusion: dynamic
  estimated_gpu_hours: 0.4
  output_dir: artifacts/experiments/full_conservative
  tags: []
- id: full_balanced
  group: method
  description: Full method balanced profile
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/evaluate_adaptive.py --config configs/rad/adaptive.yaml --profile
    balanced --seed {seed} --device {device} --output-dir {output_dir}
  config:
    method:
      name: full_method
      profile: balanced
      fusion: dynamic
  estimated_gpu_hours: 0.4
  output_dir: artifacts/experiments/full_balanced
  tags: []
- id: full_aggressive
  group: method
  description: Full method aggressive profile
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/evaluate_adaptive.py --config configs/rad/adaptive.yaml --profile
    aggressive --seed {seed} --device {device} --output-dir {output_dir}
  config:
    method:
      name: full_method
      profile: aggressive
      fusion: dynamic
  estimated_gpu_hours: 0.4
  output_dir: artifacts/experiments/full_aggressive
  tags: []
- id: random_exit_matched
  group: method
  description: Random exit matched to exit-depth distribution
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/evaluate_adaptive.py --config configs/rad/adaptive.yaml --seed
    {seed} --device {device} --output-dir {output_dir} --profile balanced
  config:
    method:
      name: random_exit_matched
      policy: random_matched
  estimated_gpu_hours: 0.35
  output_dir: artifacts/experiments/random_exit_matched
  tags: []
- id: oracle_earliest_exit
  group: method
  description: Oracle earliest sufficient exit
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/evaluate_adaptive.py --config configs/rad/adaptive.yaml --seed
    {seed} --device {device} --output-dir {output_dir} --profile balanced
  config:
    method:
      name: oracle_earliest_exit
      policy: oracle
  estimated_gpu_hours: 0.45
  output_dir: artifacts/experiments/oracle_earliest_exit
  tags: []
- id: ablation_dlcm_with_shapley
  group: ablation
  description: DLCM trained with Shapley supervision
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/train_fusion.py --config configs/rad/fusion.yaml --seed {seed}
    --device {device} --output-dir {output_dir}
  config:
    method:
      name: ablation
      dlcm_supervision: shapley
    fusion:
      shapley_supervision: true
  estimated_gpu_hours: 1.5
  output_dir: artifacts/experiments/ablation_dlcm_with_shapley
  tags:
  - dlcm
  - shapley
- id: ablation_dlcm_without_shapley
  group: ablation
  description: DLCM without Shapley supervision
  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/train_fusion.py --config configs/rad/fusion.yaml --seed {seed}
