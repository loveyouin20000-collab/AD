  immutable: true
  seed: 111
  device: '{device}'
  command: python tools/train_fusion.py --config configs/rad/fusion.yaml --seed {seed}
    --device {device} --output-dir {output_dir}
  config:
    method:
      name: ablation
      training: staged
    training:
      mode: staged
      joint: false
  estimated_gpu_hours: 2.0
  output_dir: artifacts/experiments/ablation_training_staged
  tags:
  - training
- id: ablation_training_joint
  group: ablation
  description: Optional joint fine-tuning (disabled until staged gates pass)
  immutable: true
  seed: 111
  device: '{device}'
  experiment_kind: training_ablation
  primary_pipeline: false
  requires_gates:
  - fusion_stage_passed
  - lse_stage_passed
  command: python tools/train_joint.py --config configs/rad/joint.yaml --fusion-checkpoint
    artifacts/fusion/mvtec_seed111/checkpoints/best_gate_passed.pt --lse-checkpoint
    artifacts/lse/mvtec_seed111/checkpoints/best_gate_passed.pt --seed {seed} --device
    {device} --output-dir {output_dir} --allow-joint
  config:
    method:
      name: ablation
      training: joint
    training:
      mode: joint
      joint: true
  estimated_gpu_hours: 2.5
  output_dir: artifacts/experiments/ablation_training_joint
  tags:
  - training
