seed: 111
device: cuda:0
image_size: 518
backbone:
  depth: 24
  candidate_layers: [6, 12, 18, 24]
data:
  dataset: mvtec
  data_path: /root/autodl-tmp/data/mvtec
  split_manifest: artifacts/splits/mvtec_seed111.jsonl
teacher:
  checkpoint_path: weight/train_on_mvtec/CLIP.pth
  backbone: "ViT-L/14@336px"
cache:
  schema_version: 1
  shard_size: 16
fusion:
  train_cache: artifacts/cache/mvtec_teacher/train
  calibration_cache: artifacts/cache/mvtec_teacher/calibration
  shapley_targets: artifacts/targets/shapley/mvtec_train.pt
  descriptor_stats: artifacts/stats/mvtec_seed111.json
  train_depths: [12, 18, 24]
  output_dir: artifacts/checkpoints/fusion
lse:
  dlcm_checkpoint: artifacts/checkpoints/fusion/seed_222/dlcm.pt
  train_cache: artifacts/cache/mvtec_teacher/train
  calibration_cache: artifacts/cache/mvtec_teacher/calibration
  descriptor_stats: artifacts/stats/mvtec_seed111.json
  train_gain_targets: artifacts/targets/gain/mvtec_train.pt
  calibration_gain_targets: artifacts/targets/gain/mvtec_calibration.pt
  train_depths: [12, 18, 24]
  early_depths: [12, 18]
  full_depth: 24
  epsilon_gain: 0.05
  epsilon_absolute: 0.5
  state_dim: 26
  sufficiency_weight: 0.5
  lr: 0.001
  batch_size: 32
  epochs: 30
  patience: 10
  output_dir: artifacts/targets/gain
  train_output_dir: artifacts/checkpoints/lse
selector:
  mask_mode: train_and_infer
  signals:
    response: true
    uncertainty: true
    stability: true
    complementarity: true
    token_separation: true
zero_shot:
  source_dataset: mvtec
  target_datasets: [visa]
  target_tuning: false
