name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  cpu-gates:
    name: CPU unit tests, Ruff, mypy, config dry-runs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install -r requirements-dev.txt
          python -m pip install pyyaml types-PyYAML
          # Force CPU torch wheels, then restore numpy compatible with scipy/sklearn pins.
          python -m pip install --force-reinstall \
            torch==2.0.0 torchvision==0.15.1 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --force-reinstall "numpy==1.24.4"

      - name: Ruff
        run: |
          # Scope: library + tests + export CLI. Broader tools/ lint is tracked separately.
          ruff check rad tests/rad tools/export_paper_tables.py

      - name: Mypy (selected packages)
        run: |
          mypy rad/evaluation/paper_tables.py tools/export_paper_tables.py \
            --follow-imports=silent

      - name: Pytest (CPU)
        run: pytest tests/rad -q --tb=short
        env:
          CUDA_VISIBLE_DEVICES: ""
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
          CUBLAS_WORKSPACE_CONFIG: ":4096:8"
          PYTHONHASHSEED: "0"

      - name: Config / CLI dry-runs
        run: |
          python tools/export_paper_tables.py \
            --results /tmp/rad-ci-paper-results \
            --output-dir /tmp/rad-ci-paper-export \
            --config configs/rad/ci/experiments.yaml \
            --seed 111 \
            --dry-run
          python tools/run_experiment_matrix.py \
            --config configs/rad/ci/experiments.yaml \
            --dry-run \
            --num-gpus 1 \
            --output-dir /tmp/rad-ci-matrix-dry-run

  autodl-gpu-gate:
    name: Document AutoDL GPU numerical-equivalence gate
    runs-on: ubuntu-latest
    steps:
      - name: GPU gate notice
        run: |
          echo "GPU numerical-equivalence and latency benchmarks remain an AutoDL gate."
          echo "Run on AutoDL with CUDA:"
          echo "  pytest tests/rad -q -k 'equivalence or latency or cuda'"
          echo "  python tools/benchmark_latency.py --config configs/rad/benchmark.yaml --dry-run"
