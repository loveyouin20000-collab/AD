name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  cpu-gates:
    name: CPU unit tests, Ruff, mypy, config dry-runs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          # Torch CPU wheel keeps CI runnable without CUDA.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install -r requirements-dev.txt
          python -m pip install pyyaml types-PyYAML

      - name: Ruff
        run: ruff check rad tools tests/rad

      - name: Mypy (selected packages)
        run: |
          mypy rad/evaluation/paper_tables.py tools/export_paper_tables.py \
            --follow-imports=silent

      - name: Pytest (CPU)
        run: pytest tests/rad -q --tb=short
        env:
          CUDA_VISIBLE_DEVICES: ""

      - name: Config / CLI dry-runs
        run: |
          python tools/export_paper_tables.py \
            --results artifacts/results \
            --output-dir artifacts/paper_ci_dry_run \
            --seed 111 \
            --dry-run
          python tools/run_experiment_matrix.py \
            --config configs/rad/experiments.yaml \
            --dry-run \
            --num-gpus 1 \
            --output-dir artifacts/matrix_ci_dry_run

  autodl-gpu-gate:
    name: Document AutoDL GPU numerical-equivalence gate
    runs-on: ubuntu-latest
    steps:
      - name: GPU gate notice
        run: |
          echo "GPU numerical-equivalence and latency benchmarks remain an AutoDL gate."
          echo "Run on AutoDL with CUDA:"
          echo "  pytest tests/rad -q -k 'equivalence or latency or cuda'"
          echo "  python tools/benchmark_latency.py --config configs/rad/benchmark.yaml --dry-run"
